<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <title>Sales Tracker</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-2: #eceef2;
      --border: #dcdfe5;
      --ink: #111827;
      --ink-2: #4b5563;
      --ink-3: #6b7280;
      --sales: #15803d;
      --sales-hi: #22c55e;
      --cease: #c2410c;
      --cease-hi: #f97316;
      --good: #15803d;
      --danger: #b91c1c;
      --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 8px 24px rgb(0 0 0 / .06);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f17;
        --surface: #151b26;
        --surface-2: #1e2532;
        --border: #2a3342;
        --ink: #f3f4f6;
        --ink-2: #b6bdc9;
        --ink-3: #8a93a3;
        --sales: #16a34a;
        --sales-hi: #4ade80;
        --cease: #dc4a0f;
        --cease-hi: #fb923c;
        --good: #4ade80;
        --danger: #f87171;
        --shadow: none;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
      max-width: 560px;
      margin: 0 auto;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--sales-hi); outline-offset: 2px; }
    svg { width: 18px; height: 18px; flex: none; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .title small { display: block; color: var(--ink-3); font-size: .8rem; font-weight: 500; }
    h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
    .btn-calc {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
      border-radius: 999px; padding: 9px 14px; font-size: .95rem; font-weight: 600;
    }

    /* Summary */
    .summary {
      background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
      border-radius: 18px; padding: 14px 16px; display: grid; gap: 10px;
    }
    .stats { display: flex; justify-content: space-between; align-items: baseline; }
    .stat .num { font-size: 1.5rem; font-weight: 750; font-variant-numeric: tabular-nums; }
    .stat .cap { color: var(--ink-3); font-size: .78rem; font-weight: 500; }
    .stat:last-child { text-align: right; }
    .split { display: flex; gap: 2px; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
    .split span { transition: flex-grow .25s ease; }
    .split .s { background: var(--sales); flex-grow: 0; }
    .split .c { background: var(--cease); flex-grow: 0; }

    /* Tap targets */
    .big {
      position: relative; overflow: hidden;
      flex: 1; min-height: 150px;
      border: 0; border-radius: 26px;
      color: #fff;
      display: grid; grid-template-rows: auto 1fr auto; padding: 18px 20px;
      text-align: left;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / .15), var(--shadow);
      transition: transform .08s ease, filter .08s ease;
    }
    .big:active { transform: scale(.975); filter: brightness(.92); }
    .big .name { font-size: 1.1rem; font-weight: 650; opacity: .95; }
    .big .count {
      align-self: center; justify-self: center;
      font-size: clamp(4rem, 18vw, 6rem); font-weight: 800; line-height: 1;
      font-variant-numeric: tabular-nums; letter-spacing: -.03em;
    }
    .big .last { font-size: .82rem; opacity: .8; font-variant-numeric: tabular-nums; }
    .sales { background: linear-gradient(160deg, var(--sales-hi) -60%, var(--sales) 60%); }
    .cease { background: linear-gradient(160deg, var(--cease-hi) -60%, var(--cease) 60%); }
    .bump { animation: bump .22s ease; }
    @keyframes bump { 40% { transform: scale(1.12); } }
    .ripple {
      position: absolute; border-radius: 50%; pointer-events: none;
      width: 40px; height: 40px; margin: -20px 0 0 -20px;
      background: rgb(255 255 255 / .35); animation: ripple .5s ease-out forwards;
    }
    @keyframes ripple { to { transform: scale(14); opacity: 0; } }

    /* Secondary actions */
    .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .small {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background: var(--surface); color: var(--ink-2);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 12px 8px; font-size: .9rem; font-weight: 600;
      transition: background .15s, color .15s, border-color .15s;
    }
    .small:active { background: var(--surface-2); }
    .small:disabled { opacity: .45; }
    .small.armed { background: var(--danger); border-color: var(--danger); color: #fff; }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px);
      transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
      background: var(--ink); color: var(--bg);
      padding: 10px 16px; border-radius: 999px; font-size: .9rem; font-weight: 600;
      transition: opacity .2s, transform .2s; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* Calculator sheet */
    dialog {
      border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 480px;
      background: var(--surface); color: var(--ink);
      border-radius: 26px 26px 0 0;
    }
    dialog::backdrop { background: rgb(0 0 0 / .5); }
    dialog[open] { animation: up .22s ease-out; }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } }
    .sheet {
      padding: 10px 20px calc(env(safe-area-inset-bottom) + 20px);
      display: flex; flex-direction: column; gap: 14px;
    }
    .grabber { width: 40px; height: 5px; border-radius: 999px; background: var(--border); margin: 0 auto 4px; }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; }
    .sheet h2 { margin: 0; font-size: 1.15rem; }
    .icon-btn {
      display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
      border: 0; background: var(--surface-2); color: var(--ink-2);
    }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .fields .wide { grid-column: 1 / -1; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: .82rem; font-weight: 600; color: var(--ink-2); }
    .label-row { display: flex; justify-content: space-between; align-items: center; }
    .chip {
      border: 0; background: var(--surface-2); color: var(--ink-2);
      border-radius: 999px; padding: 3px 10px; font-size: .75rem; font-weight: 600;
    }
    .input { position: relative; display: flex; align-items: center; }
    .input .suffix { position: absolute; right: 14px; color: var(--ink-3); font-size: 1.1rem; pointer-events: none; }
    input {
      width: 100%; font: inherit; font-size: 1.25rem; font-variant-numeric: tabular-nums;
      padding: 12px 14px; border-radius: 14px;
      border: 1px solid var(--border); background: var(--bg); color: var(--ink);
      user-select: text; -webkit-user-select: text;
    }
    .result {
      padding: 16px; border-radius: 18px; background: var(--bg); border: 1px solid var(--border);
      display: grid; gap: 10px;
    }
    .result-top { display: flex; align-items: baseline; gap: 10px; }
    .result .value { font-size: 2.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .result .label { color: var(--ink-2); font-size: .9rem; }
    .result.met .value { color: var(--good); }
    .progress { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); }
    .progress .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--sales); width: 0; transition: width .25s ease; }
    .progress .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; }
    .scale { display: flex; justify-content: space-between; color: var(--ink-3); font-size: .75rem; font-variant-numeric: tabular-nums; }
    .progress-wrap[hidden] { display: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    @media (max-height: 640px) {
      .big { min-height: 120px; padding: 14px 18px; }
      .big .count { font-size: 3.5rem; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-calc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h4"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  </svg>

  <header>
    <div class="title">
      <small id="today"></small>
      <h1>Sales Tracker</h1>
    </div>
    <button class="btn-calc" id="openCalc"><svg><use href="#i-calc"/></svg>Target</button>
  </header>

  <section class="summary" aria-label="Summary">
    <div class="stats">
      <div class="stat"><div class="num" id="total">0</div><div class="cap">Total calls</div></div>
      <div class="stat"><div class="num" id="rate">–</div><div class="cap">Sales share</div></div>
    </div>
    <div class="split" aria-hidden="true"><span class="s" id="splitS"></span><span class="c" id="splitC"></span></div>
  </section>

  <button class="big sales" id="salesBtn" aria-describedby="salesLast">
    <span class="name">Sales call</span>
    <span class="count" id="salesCount" aria-live="polite">0</span>
    <span class="last" id="salesLast">Tap to log</span>
  </button>

  <button class="big cease" id="ceaseBtn" aria-describedby="ceaseLast">
    <span class="name">Cease call</span>
    <span class="count" id="ceaseCount" aria-live="polite">0</span>
    <span class="last" id="ceaseLast">Tap to log</span>
  </button>

  <div class="row">
    <button class="small" id="undoBtn"><svg><use href="#i-undo"/></svg>Undo</button>
    <button class="small" id="exportBtn"><svg><use href="#i-down"/></svg>Export</button>
    <button class="small" id="resetBtn"><svg><use href="#i-reset"/></svg><span>Reset</span></button>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <dialog id="modal" aria-labelledby="calcTitle">
    <div class="sheet">
      <div class="grabber"></div>
      <div class="sheet-head">
        <h2 id="calcTitle">Sales needed for minimum</h2>
        <button class="icon-btn" id="closeCalc" aria-label="Close"><svg><use href="#i-x"/></svg></button>
      </div>
      <div class="fields">
        <label>Full target
          <span class="input"><input type="number" inputmode="decimal" id="x" placeholder="100"></span>
        </label>
        <label>Minimum
          <span class="input"><input type="number" inputmode="decimal" id="y" placeholder="85"><span class="suffix">%</span></span>
        </label>
        <label class="wide">
          <span class="label-row">Actual sales so far <button class="chip" id="useTally" type="button"></button></span>
          <span class="input"><input type="number" inputmode="decimal" id="z" placeholder="60"></span>
        </label>
      </div>
      <div class="result" id="result" aria-live="polite">
        <div class="result-top">
          <div class="value" id="resultValue">–</div>
          <div class="label" id="resultLabel">Enter your target and minimum</div>
        </div>
        <div class="progress-wrap" id="progressWrap" hidden>
          <div class="progress"><div class="fill" id="progressFill"></div><div class="mark" id="progressMark"></div></div>
          <div class="scale"><span id="scaleMin"></span><span id="scaleMax"></span></div>
        </div>
      </div>
    </div>
  </dialog>

  <script>
    const $ = id => document.getElementById(id);
    const store = {
      get(key, fallback) {
        try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
      },
      set(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
      }
    };
    const labels = { sales: 'Sales call', cease: 'Cease call' };
    const fmtTime = d => d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

    $('today').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

    let toastTimer;
    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    // --- Call log: every tap stored as { type, ts } ---
    let log = store.get('log', []);

    function render() {
      const counts = { sales: 0, cease: 0 }, last = {};
      for (const e of log) { counts[e.type]++; last[e.type] = e.ts; }
      const total = counts.sales + counts.cease;

      for (const type of ['sales', 'cease']) {
        $(type + 'Count').textContent = counts[type];
        $(type + 'Last').textContent = last[type] ? `Last at ${fmtTime(new Date(last[type]))}` : 'Tap to log';
      }
      $('total').textContent = total;
      $('rate').textContent = total ? Math.round(counts.sales / total * 100) + '%' : '–';
      $('splitS').style.flexGrow = counts.sales;
      $('splitC').style.flexGrow = counts.cease;
      $('undoBtn').disabled = !total;
      $('useTally').textContent = `Use tally (${counts.sales})`;
      $('useTally').dataset.value = counts.sales;
      store.set('log', log);
    }

    function tap(type, e) {
      log.push({ type, ts: new Date().toISOString() });
      if (navigator.vibrate) navigator.vibrate(30);
      render();

      const btn = e.currentTarget, count = $(type + 'Count');
      count.classList.remove('bump'); void count.offsetWidth; count.classList.add('bump');
      const r = btn.getBoundingClientRect(), dot = document.createElement('span');
      dot.className = 'ripple';
      dot.style.left = ((e.clientX || r.left + r.width / 2) - r.left) + 'px';
      dot.style.top = ((e.clientY || r.top + r.height / 2) - r.top) + 'px';
      btn.appendChild(dot);
      dot.addEventListener('animationend', () => dot.remove());
      setTimeout(() => dot.remove(), 600);
    }

    $('salesBtn').onclick = e => tap('sales', e);
    $('ceaseBtn').onclick = e => tap('cease', e);

    $('undoBtn').onclick = () => {
      const removed = log.pop();
      if (!removed) return;
      render();
      toast(`Removed ${labels[removed.type].toLowerCase()} from ${fmtTime(new Date(removed.ts))}`);
    };

    $('exportBtn').onclick = () => {
      if (!log.length) return toast('Nothing to export yet');
      const rows = log.map(e => {
        const d = new Date(e.ts);
        return [d.toLocaleDateString('en-GB'), d.toLocaleTimeString('en-GB'), labels[e.type], e.ts].join(',');
      });
      const csv = ['Date,Time,Type,Timestamp (UTC)', ...rows].join('\n');
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = `calls-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast(`Exported ${log.length} calls`);
    };

    const resetBtn = $('resetBtn'), resetLabel = resetBtn.querySelector('span');
    let resetTimer;
    function disarm() {
      clearTimeout(resetTimer);
      resetBtn.classList.remove('armed');
      resetLabel.textContent = 'Reset';
    }
    resetBtn.onclick = () => {
      if (!resetBtn.classList.contains('armed')) {
        resetBtn.classList.add('armed');
        resetLabel.textContent = 'Confirm';
        resetTimer = setTimeout(disarm, 3000);
        return;
      }
      disarm();
      log = [];
      render();
      toast('Counts reset');
    };

    render();

    // --- Target calculator: (X * Y) - Z ---
    const modal = $('modal');
    const inputs = ['x', 'y', 'z'].map($);
    const saved = store.get('calc', {});
    inputs.forEach(el => { if (saved[el.id] != null) el.value = saved[el.id]; });

    function calculate() {
      const [x, rawY, z] = inputs.map(el => parseFloat(el.value));
      // Minimum is entered as a percentage; values ≤ 1 are treated as decimals (e.g. 0.85)
      const y = rawY > 1 ? rawY / 100 : rawY;
      store.set('calc', Object.fromEntries(inputs.map(el => [el.id, el.value])));

      const result = $('result'), value = $('resultValue'), label = $('resultLabel');
      result.classList.remove('met');

      if ([x, y, z].some(isNaN)) {
        value.textContent = '–';
        label.textContent = 'Enter your target, minimum and actual';
        $('progressWrap').hidden = true;
        return;
      }

      const min = x * y;
      const needed = Math.ceil(min - z);
      if (needed > 0) {
        value.textContent = needed;
        label.textContent = `more ${needed === 1 ? 'sale' : 'sales'} to reach the ${+(y * 100).toFixed(1)}% minimum`;
      } else {
        value.textContent = '✓';
        label.textContent = `Minimum met${needed < 0 ? ` · ${-needed} over` : ''}`;
        result.classList.add('met');
      }

      const top = Math.max(x, z, 1);
      $('progressWrap').hidden = false;
      $('progressFill').style.width = Math.min(z / top, 1) * 100 + '%';
      $('progressMark').style.left = `calc(${Math.min(min / top, 1) * 100}% - 1px)`;
      $('scaleMin').textContent = `${+z.toFixed(1)} of ${+min.toFixed(1)} minimum`;
      $('scaleMax').textContent = `Target ${+x.toFixed(1)}`;
    }

    inputs.forEach(el => el.addEventListener('input', calculate));
    $('useTally').onclick = () => { $('z').value = $('useTally').dataset.value; calculate(); };
    $('openCalc').onclick = () => { calculate(); modal.showModal(); };
    $('closeCalc').onclick = () => modal.close();
    modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });
  </script>
</body>
</html>
